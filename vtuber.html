const img={},names=Object.keys(L);let n=0;
for(const k of names){const i=new Image();i.onload=()=>{if(++n==names.length)requestAnimationFrame(loop)};i.src=L[k][0];img[k]=i}
const c=document.getElementById('c'),g=c.getContext('2d');
const $=id=>document.getElementById(id);
const P={x:0,y:0,z:0,open:1,oL:1,oR:1,mouth:0,tongue:0},T={...P};
const HP=[571,300],EL=[529,219],ER=[614,218];
let t=0,tmpOpen=null,lt=0,lx=0,ly=0,first=1,lastLoop=0;
/* modo energetico (atalho): window.setEnergetico(true/false), window.toggleEnergetico(); tecla E no navegador */
let E=0,Et=0,bald=false;
window.setCareca=v=>{bald=!!v};window.toggleCareca=()=>(bald=!bald);window.careca=()=>bald;
window.setEnergetico=v=>{Et=v?1:0};
window.toggleEnergetico=()=>{Et=Et?0:1;return !!Et};
window.energetico=()=>!!Et;
addEventListener('keydown',e=>{if(e.key==='e'||e.key==='E')window.toggleEnergetico()});
const mk=()=>({a:0,w:0});
const B=mk(),F=mk(),Y=mk(),H=mk(),A1=mk(),A2=mk(),SK=mk(),SB=mk(),C1=mk(),C2=mk();
const cz=(v,m)=>Math.max(-m,Math.min(m,v));
function sp(s,i,k,cc,gg,dt){s.w+=(-k*s.a-cc*s.w-gg*i)*dt;s.a=cz(s.a+s.w*dt,.45)}
function pend(s,tg,dt){s.w+=(38*(tg-s.a)-4.5*s.w)*dt;s.a+=s.w*dt}
function phys(dt){
 const S=+$('phys').value,hx=P.x*10+P.z*2+E*Math.sin(t*1.7)*8,hy=P.y*7+Math.sin(t*1.6)*1.5;
 if(first){lx=hx;ly=hy;first=0;return}
 const vx=(hx-lx)/dt,vy=(hy-ly)/dt;lx=hx;ly=hy;
 sp(B,vx,55,5,.045*S,dt);sp(F,vx,90,8,.03*S,dt);sp(Y,vy,120,9,1.2*S,dt);sp(H,vx,70,3.5,.06*S,dt);
 sp(A1,vx,60,6,.02*S,dt);sp(A2,vx,60,6,.02*S,dt);sp(SK,vx,50,5,.02*S,dt);sp(SB,vx,40,4,.03*S,dt);
 const ph=t*1.7;
 pend(C1,(Math.sin(ph)*.07-vx*.0009*S),dt);pend(C2,(Math.sin(ph-1.1)*.07-vx*.0009*S),dt)}
function pt(k,o){
 o=o||{};const [,x,y]=L[k];g.save();
 if(o.dx||o.dy)g.translate(o.dx||0,o.dy||0);
 if(o.rot){g.translate(o.pv[0],o.pv[1]);g.rotate(o.rot);g.translate(-o.pv[0],-o.pv[1])}
 if(o.sy!==undefined){g.translate(o.c[0],o.c[1]);g.scale(o.sx||1,o.sy);g.translate(-o.c[0],-o.c[1])}
 g.drawImage(img[k],x,y);g.restore()}
function head(d,fn){
 g.save();g.translate(HP[0],HP[1]);g.rotate(P.z*Math.PI/180+E*Math.sin(t*1.7)*.07);
 g.translate(-HP[0]+P.x*d*10,-HP[1]+P.y*d*7);fn();g.restore()}
function eye(s,ce){
 const o=(tmpOpen!==null?tmpOpen:P['o'+s])*(1-.22*E),sy=Math.max(.04,o);
 const gx=P.x*4+E*Math.sin(t*2.3+(s=='L'?0:1.5))*3,gy=P.y*4+E*Math.cos(t*2.9)*2;
 head(1.6,()=>{
  pt('iris'+s,{sy,c:ce,dx:gx,dy:gy});
  if(E>.5){
   const k='spiral'+s,[,x,y]=L[k],w=img[k].width,h=img[k].height,cx=x+w/2,cy=y+h/2;
   g.save();g.translate(gx,gy);g.translate(ce[0],ce[1]);g.scale(1,sy);g.translate(-ce[0],-ce[1]);
   g.translate(cx,cy);g.rotate((s=='L'?1:-1)*t*3.2);g.translate(-cx,-cy);g.drawImage(img[k],x,y);g.restore()
  }else pt('ring'+s,{sy,c:ce,dx:gx,dy:gy});
  pt('lid'+s)})}
function brow(s){const o=(tmpOpen!==null?tmpOpen:P['o'+s])*(1-.22*E);head(1.3,()=>pt('brow'+s,{dy:-(o<.5?3:0)}))}
function strapHalf(side,a,pv){
 g.save();g.beginPath();if(side=='L')g.rect(0,0,571,1298);else g.rect(571,0,641,1298);g.clip();
 g.translate(pv[0],pv[1]);g.rotate(a);g.translate(-pv[0],-pv[1]);g.drawImage(img.straps,L.straps[1],L.straps[2]);g.restore()}
function arm(side,a,pv){
 const o={rot:a,pv:pv};pt(side=='L'&&E<.5?'armLN':'arm'+side,o);pt('cuff'+side,o)}
function mouthBack(){
 const m=P.mouth;if(m<.08)return;
 g.save();g.beginPath();g.rect(520,308-32*m,110,32*m+4);g.clip();pt('mFill');g.restore()}
function mouthFront(){
 const m=P.mouth,pk=E>.5?'mouthN':'mouthD';
 if(m<.08){pt(pk);return}
 g.save();g.beginPath();g.rect(500,240,150,90);g.rect(520,308-32*m,110,32*m+4);g.clip('evenodd');pt(pk);g.restore();
 pt('mOut',{sy:m,c:[571,307]})}
function loop(ms){
 if(ms-lastLoop<33){requestAnimationFrame(loop);return}
 lastLoop=ms;t=ms/1000;
 const d0=Math.min(.05,Math.max(.001,t-lt));
 for(const k in P){const r=(k=='oL'||k=='oR')?55:k=='mouth'?40:20;P[k]+=(T[k]-P[k])*(1-Math.exp(-d0*r))}
 E+=(Et-E)*(1-Math.exp(-d0*6));
 const dt=Math.min(.033,Math.max(.001,t-lt));lt=t;phys(dt);
 const br=Math.sin(t*1.6),bob=br*1.6,sw=E*Math.sin(t*1.7);
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,1212,1298);
 const lw=Math.sin(t*1.1)*.018+sw*.02,lk=P.x*.015;
 const up=fn=>{g.save();g.translate(P.x*5+sw*8,bob);g.translate(571,640);g.rotate(P.z*.0035+E*Math.sin(t*1.7+.5)*.02);g.translate(-571,-640);fn();g.restore()};
 const aw=Math.sin(t*1.5)*.02+E*Math.sin(t*2.6)*.03;
 // ordem de tras para frente: cabelo, bracos, pernas, correntes, torso, saia, gola, cabeca
 up(()=>{if(!bald)head(.9,()=>pt('hairBack',{rot:B.a*.5,pv:[571,140],dy:Y.a*.3}));
  arm('L',A2.a+aw,[470,330]);arm('R',A1.a-aw,[668,330])});
 pt('stoneLow',{rot:-lw+lk,pv:[640,655]});pt('stoneUp',{rot:-lw+lk,pv:[640,655]});
 pt('legSkin',{rot:lw+lk,pv:[510,655]});pt('boot',{rot:lw+lk,pv:[510,655]});

 up(()=>{const k=Math.tan(cz(SK.a*.8,.3)+Math.sin(t*1.3+.4)*.008);g.save();g.transform(1,0,k,1,-k*575,0);pt('skirt');g.restore()});
 up(()=>{pt('collar');
  head(1,()=>pt('antenna',{rot:H.a*.25,pv:[650,215]}));

for(const k of ['x','y','z','open','mouth'])$(k).oninput=e=>T[k]=+e.target.value;
$('open').oninput=e=>T.oL=T.oR=+e.target.value;
(function blink(){setTimeout(()=>{if($('blink').checked&&!tr){tmpOpen=0;setTimeout(()=>tmpOpen=null,130)}blink()},2500+Math.random()*3000)})();

/* ===== versão flutuante (transparente, com câmera) ===== */
let tr=null,trackOn=false;
const V=$('v'),vg=V.getContext('2d');
let dpr=1,crop=null,cb=null,lt2=0,lookT=0,lastDraw=0;
function resize(){dpr=Math.min(1.5,window.devicePixelRatio||1);V.width=Math.max(2,Math.round(innerWidth*dpr));V.height=Math.max(2,Math.round(innerHeight*dpr))}
addEventListener('resize',resize);resize();
function measure(){
  const w=c.width>>2,h=c.height>>2,t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(c,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>10){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return;
  if(!cb)cb={x0,y0,x1,y1};else{cb.x0=Math.min(cb.x0,x0);cb.y0=Math.min(cb.y0,y0);cb.x1=Math.max(cb.x1,x1);cb.y1=Math.max(cb.y1,y1)}
  const pad=12,a=Math.max(0,cb.x0-pad),b=Math.max(0,cb.y0-pad),e=Math.min(w-1,cb.x1+pad),f=Math.min(h-1,cb.y1+pad);
  crop={x:a*4,y:b*4,w:(e-a+1)*4,h:(f-b+1)*4}}
let mn=0;const mt=setInterval(()=>{measure();if(++mn>30)clearInterval(mt)},300);

function idleLook(now){
  if(trackOn||now<lookT)return;
  lookT=now+2500+Math.random()*3500;
  T.x=(Math.random()-.5)*1.0;T.y=(Math.random()-.5)*.5;T.z=(Math.random()-.5)*6}

function frame(now){
  requestAnimationFrame(frame);
  if(now-lastDraw<33)return;
  lastDraw=now;lt2=now;const W=V.width,H=V.height;
  vg.setTransform(1,0,0,1,0,0);vg.clearRect(0,0,W,H);
  if(!crop)return;
  idleLook(now);
  const s=Math.min(W*.98/crop.w,H*.98/crop.h),hw=crop.w*s/2,hh=crop.h*s/2;
  vg.imageSmoothingQuality='medium';
  vg.drawImage(c,crop.x,crop.y,crop.w,crop.h,W/2-hw,H/2-hh,hw*2,hh*2)}
requestAnimationFrame(frame);

/* rastreio do rosto (mesma lógica do seu arquivo) */
const cl2=(v,m)=>Math.max(-m,Math.min(m,v));
const ear=(lm,i,o,u,d)=>Math.hypot(lm[u].x-lm[d].x,lm[u].y-lm[d].y)/(Math.hypot(lm[i].x-lm[o].x,lm[i].y-lm[o].y)||1);
window.calibrate=()=>{if(tr){tr.base=null;tr.jmin=undefined;tr.eo=undefined}};
window.toggleGreen=()=>document.documentElement.classList.toggle('green');
let retry=0,lastVT=-1,lastDetectAt=0,lastFaceAt=0;
async function startTrack(){
  try{
    const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const {FaceLandmarker:FL,FilesetResolver:FR}=await import(CDN+'/vision_bundle.mjs');
    const fs=await FR.forVisionTasks(CDN+'/wasm');
    const mk=d=>FL.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
    let fl;try{fl=await mk('GPU')}catch(e){fl=await mk('CPU')}
    const v=$('cam');
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:24,max:24}},audio:false});
    await v.play();
    tr={fl,v,base:null};trackOn=true;step();
  }catch(e){trackOn=false;tr=null;if(++retry<6)setTimeout(startTrack,10000)}}
function step(){
  if(!tr)return;
  const v=tr.v,now=performance.now();
  if(v.readyState>=2&&v.currentTime!==lastVT&&now-lastDetectAt>=66){
    lastVT=v.currentTime;lastDetectAt=now;let r=null;try{r=tr.fl.detectForVideo(v,now)}catch(e){}
    const lm=r&&r.faceLandmarks&&r.faceLandmarks[0];
    if(lm){
      lastFaceAt=now;
      const a=lm[33],b=lm[263],n=lm[1],ed=Math.hypot(b.x-a.x,b.y-a.y)||1,yaw=(n.x-(a.x+b.x)/2)/ed,pit=(n.y-(a.y+b.y)/2)/ed,roll=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI,m=1;
      if(!tr.base)tr.base=[yaw,pit];
      T.x=cl2(-m*(yaw-tr.base[0])*3,1);T.y=cl2((pit-tr.base[1])*4,1);T.z=cl2(-m*roll,15);
      const bs=r.faceBlendshapes&&r.faceBlendshapes[0];
      if(bs){const g=k=>{const c=bs.categories.find(x=>x.categoryName===k);return c?c.score:0},f=x=>1-Math.min(1,Math.max(0,(x-.12)/.28)),l=f(g('eyeBlinkLeft')),rr=f(g('eyeBlinkRight'));
        const ea=ear(lm,33,133,159,145),eb=ear(lm,362,263,386,374);tr.eo=tr.eo?[Math.max(ea,tr.eo[0]*.9998),Math.max(eb,tr.eo[1]*.9998)]:[ea,eb];const fo=(e,o)=>Math.min(1,Math.max(0,(e/o-.4)/.25)),la=Math.min(rr,fo(ea,tr.eo[0])),lb=Math.min(l,fo(eb,tr.eo[1]));T.oL=m>0?la:lb;T.oR=m>0?lb:la;const jw=g('jawOpen');T.tongue=Math.min(1,Math.max(0,(g('tongueOut')-.12)/.35));tr.jmin=tr.jmin===undefined?jw:Math.min(jw,tr.jmin+.00008);T.mouth=Math.min(1,Math.max(0,(jw-tr.jmin-.03)/.3))}else{T.oL=1;T.oR=1;T.mouth=0;T.tongue=0}
    }else if(now-lastFaceAt>500){T.oL=1;T.oR=1;T.mouth=0;T.tongue=0;if(tr.eo)tr.eo=null;tr.jmin=undefined}
  }else if(now-lastFaceAt>500){T.oL=1;T.oR=1;T.mouth=0;T.tongue=0;if(tr.eo)tr.eo=null;tr.jmin=undefined}
  requestAnimationFrame(step)}
startTrack();
